[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-ws="0.4"
futures-util = "0.3"
bcrypt = "0.19.3"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = {version="1.0.229", features=["derive"]}
serde_json = "1.0"
rand = "0.9"
chrono = "0.4"
futures = "0.3.34"
tokio ={ version="1.53.1",features = ["full"]}
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls","chrono"] }
dashmap = "6.2.1"


